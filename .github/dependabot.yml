version: 2

updates:
  # ── npm dependencies ────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Group minor/patch updates to reduce PR noise.
    # Security updates always get individual PRs regardless of grouping.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ── GitHub Actions — keeps all pinned SHAs current ──────────────
  # When an action releases a new version, Dependabot opens a PR with
  # the new SHA and a tag comment. This is what maintains SHA pins across
  # ci.yml, codeql.yml, and dependency-review.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    # Group the codeql-action sub-actions so they can never bump apart.
    #
    # Dependabot treats github/codeql-action/init, /autobuild and /analyze as
    # three separate dependencies and will happily bump one of them. CodeQL
    # requires all three to be the same version, so a split bump fails the run
    # with: "Loaded a configuration file for version 'X', but running version 'Y'".
    # That is exactly what PR #88 did (init -> 4.37.4, autobuild left at 4.35.2).
    # Grouping makes a single PR that moves all three together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
