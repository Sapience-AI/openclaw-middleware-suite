name: Publish to ClawHub

# Publishes this plugin to ClawHub (https://clawhub.ai), the OpenClaw skill /
# package registry. Mirrors the trigger pattern in npm-publish.yml so that one
# `gh release create vX.Y.Z` cuts both the npm publish and the ClawHub publish
# atomically. `workflow_dispatch` is kept as a manual escape hatch and also
# enables OIDC-based trusted publishing without a token.
#
# Detected family: code-plugin (this repo ships `openclaw.compat.pluginApi` and
# `openclaw.build.openclawVersion` in package.json, plus `openclaw.plugin.json`).
on:
  release:
    types: [published]
  pull_request:
    paths:
      - "package.json"
      - "openclaw.plugin.json"
      - ".github/workflows/clawhub-publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — resolve metadata without publishing."
        required: false
        type: boolean
        default: false

# HARDENED: deny all permissions by default; the publish job grants only
# what it needs. Mirrors the convention in ci.yml and npm-publish.yml.
permissions: {}

# ── The @SHA pin below is a control, not a style choice — do not revert to @main ──
# `openclaw/clawhub` is an EXTERNAL org, and the publish job hands its workflow our
# CLAWHUB_TOKEN and an `id-token: write` OIDC identity. Referenced at a mutable
# `@main`, anyone who can push to (or compromise) that branch could change what runs
# inside our publish job at any time, with our publish credential in scope. The commit
# SHA is immutable, so the code we reviewed is the code that runs. Same discipline as
# the `actions/checkout@<sha>` pins elsewhere in this repo.
#
# Updating: bump the SHA deliberately. Dependabot's `github-actions` ecosystem
# (.github/dependabot.yml) tracks reusable-workflow refs and will open a PR when
# upstream moves — review that diff rather than re-floating the ref.
#
# Residual worth knowing: pinning fixes *this* file at a known commit, but that file's
# own internal `uses:` references are outside our control. The durable fix is to
# fork/vendor package-publish.yml into Sapience-AI and pin that.

jobs:
  # PR runs are dry-run only so CI never publishes from untrusted refs.
  dry-run:
    name: ClawHub dry-run
    if: github.event_name == 'pull_request'
    permissions:
      actions: read       # nested job reads run artifacts (package / inspector / publish-json)
      contents: read
      id-token: write     # reusable workflow resolves its own source via OIDC
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@82313c2bb17fb8401c41c8ed2b0144d42b461ae7 # main as of 2026-08-06
    with:
      dry_run: true

  # Real publish on release-published, or on workflow_dispatch unless the
  # operator explicitly ticks dry_run.
  publish:
    name: ClawHub publish
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    permissions:
      actions: read       # nested job reads run artifacts (package / inspector / publish-json)
      contents: read
      id-token: write     # OIDC trusted publishing on workflow_dispatch
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@82313c2bb17fb8401c41c8ed2b0144d42b461ae7 # main as of 2026-08-06
    with:
      dry_run: false
      owner: sapience-ai-corporation
    secrets:
      # Required for tag/release publishes. Trusted publishing (OIDC) only
      # covers `workflow_dispatch`; tag pushes still need the token.
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  # Manual dry-run path: workflow_dispatch with dry_run=true.
  manual-dry-run:
    name: ClawHub manual dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    permissions:
      actions: read       # nested job reads run artifacts (package / inspector / publish-json)
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@82313c2bb17fb8401c41c8ed2b0144d42b461ae7 # main as of 2026-08-06
    with:
      dry_run: true
