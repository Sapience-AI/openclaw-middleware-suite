# Security — Tier 2: PR Merge Gate
#
# Triggers on every pull_request targeting main. Runs the full Sapience
# security scanning suite in parallel via reusable workflows from
# SapienceAICorp-Infrastructure.
#
# check contexts for required_status_checks registration:
#   gitleaks / Gitleaks secret scan
#   semgrep / Semgrep OSS scan
#   trufflehog / TruffleHog verified-credential scan
#   checkov / Checkov IaC scan
#   pre-commit / Pre-commit checks
#   pre-commit / Gitleaks history scan
#
# Advisory period: new checks are informational only until ~Sep 19 2026,
# after which they will be registered as required on the repo-level ruleset.
#
# This file replaces the standalone secret-scan.yml. Do NOT run both — the
# gitleaks reusable workflow uses concurrency: gitleaks-${{ github.ref }} with
# cancel-in-progress: true, so two callers on the same ref will cancel each other.
#
# SHA provenance:
#   gitleaks: 9d4e33bd85d8bd96a221e5d8b100e017a0af58b3 (detect fix + fail-closed)
#   semgrep/trufflehog/checkov/pre-commit: a68354d9707c94fc5c30c158a745c493bbd8e8be
#
# Owned by: Platform Security

name: "Security - Tier 2: PR Merge Gate"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-tier2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  gitleaks:
    uses: Sapience-AI/SapienceAICorp-Infrastructure/.github/workflows/gitleaks.yml@9d4e33bd85d8bd96a221e5d8b100e017a0af58b3
    secrets: inherit

  semgrep:
    uses: Sapience-AI/SapienceAICorp-Infrastructure/.github/workflows/semgrep.yml@a68354d9707c94fc5c30c158a745c493bbd8e8be
    secrets: inherit

  trufflehog:
    uses: Sapience-AI/SapienceAICorp-Infrastructure/.github/workflows/trufflehog.yml@a68354d9707c94fc5c30c158a745c493bbd8e8be
    secrets: inherit

  checkov:
    uses: Sapience-AI/SapienceAICorp-Infrastructure/.github/workflows/checkov.yml@a68354d9707c94fc5c30c158a745c493bbd8e8be
    secrets: inherit

  pre-commit:  # pre-commit hooks + gitleaks history scan
    uses: Sapience-AI/SapienceAICorp-Infrastructure/.github/workflows/security-scan.yaml@a68354d9707c94fc5c30c158a745c493bbd8e8be
    secrets: inherit

# canary: verify tier callers fire from this public repo (SAI-6591)
